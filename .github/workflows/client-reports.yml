name: Client reports
on:
  schedule:
    - cron: '30 7 * * 1'
    - cron: '30 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: client-reports
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull report files from GHL
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, gzip, re, urllib.request
          LOC = 'PtM2395FzM037y7k8k6O'
          H = {'Authorization': 'Bearer ' + os.environ['GHL_TOKEN'], 'Version': '2021-07-28', 'Accept': 'application/json', 'User-Agent': 'go-reports'}
          def get(url, headers=H):
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60).read()
          q = ('https://services.leadconnectorhq.com/medias/files?altType=location&altId=' + LOC +
               '&type=file&query=gar-&sortBy=createdAt&sortOrder=desc&limit=100')
          files = json.loads(get(q))['files']
          newest = {}
          for f in files:
              if not f.get('deleted') and f['name'] not in newest:
                  newest[f['name']] = f
          def text(f):
              return get(f['url'], {'User-Agent': 'go-reports'}).decode().strip()
          def write(path, data):
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              old = open(path).read() if os.path.exists(path) else None
              if old != data:
                  open(path, 'w').write(data)
                  print('updated', path)
          if 'gar-assets.txt' in newest:
              bundle = json.loads(gzip.decompress(base64.b64decode(text(newest['gar-assets.txt']))))
              for k, v in bundle.items():
                  if k != 'shell.html':
                      write(k, v)
              write('reports/shell.html', bundle['shell.html'])
          shell = open('reports/shell.html').read()
          for name, f in newest.items():
              m = re.fullmatch(r'gar-data-([A-Za-z0-9-]+)\.txt', name)
              if not m:
                  continue
              slug = m.group(1)
              write('reports-data/' + slug + '.txt', text(f))
              write(slug + '.html', shell)
          PY
      - name: Commit changes
        run: |
          git config user.name "go-reports-bot"
          git config user.email "go-reports-bot@users.noreply.github.com"
          git add -A reports reports-data *.html
          git diff --cached --quiet || (git commit -m "Update client reports" && git push)
